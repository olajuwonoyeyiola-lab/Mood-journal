<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mood Journal</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#f8fafc;padding:12px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.btn{padding:10px 16px;background:#2B4EFF;color:white;border:0;border-radius:8px;cursor:pointer;width:100%}
.btn2{padding:8px 12px;background:white;border:1px solid #ddd;border-radius:8px;cursor:pointer}
.mood{padding:10px;border-radius:8px;border:1px solid #ddd;background:white;cursor:pointer;text-align:center;min-width:65px}
.chip{padding:6px 10px;border-radius:20px;border:1px solid #ddd;display:inline-block;margin:3px;cursor:pointer;font-size:13px}
.chip.on{background:#2B4EFF;color:white}
.mood.on{border:2px solid #2B4EFF;background:#eef2ff}
</style></head><body>
<div id="app" style="max-width:600px;margin:0 auto"></div>
<script>
const MOODS=[{v:1,e:'😭',l:'Awful'},{v:2,e:'😔',l:'Bad'},{v:3,e:'😐',l:'Okay'},{v:4,e:'😊',l:'Good'},{v:5,e:'🤩',l:'Great'}];
const ACTS=['work','exercise','sleep','study','social','relaxation','food','home','other'];
let selMood=3, selActs=[], entries=JSON.parse(localStorage.getItem('moods')||'[]'), isPremium=localStorage.getItem('premium')==='yes', limit=10;
function save(){localStorage.setItem('moods',JSON.stringify(entries));}
function render(){
  const canAdd = isPremium || entries.length < limit;
  document.getElementById('app').innerHTML=`
  <h2>Mood Journal ${isPremium?'<span style=background:#22c55e;color:white;padding:2px 8px;border-radius:10px;font-size:12px>PREMIUM</span>':''}</h2>
  <p>Entries: ${entries.length}/${isPremium?'∞':limit}</p>
  ${canAdd?`<div class=card>
  <h3>How are you feeling?</h3>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${MOODS.map(m=>`<div class="mood ${selMood===m.v?'on':''}" onclick="selMood=${m.v};render()">${m.e}<br><small>${m.l}</small></div>`).join('')}</div>
  <input id="d" type="date" value="${new Date().toISOString().slice(0,10)}">
  <input id="t" type="time" value="${new Date().toTimeString().slice(0,5)}">
  <textarea id="note" placeholder="Write your mood note..."></textarea>
  <div>${ACTS.map(a=>`<span class="chip ${selActs.includes(a)?'on':''}" onclick="toggle('${a}')">${a}</span>`).join('')}</div>
  <button class=btn onclick="add()">Save Mood</button>
  </div>`:`<div class=card style="border:2px solid #f59e0b"><h3>Free limit reached (10/10)</h3>
  <p>To continue, pay <b>₦5000</b></p>
  <p><b>Opay:</b> 8107738572<br><b>Name:</b> olajuwon oyeyiola<br><b>WhatsApp:</b> 08107738572</p>
  <input id="code" placeholder="Enter unlock code (after payment)">
  <button class=btn onclick="unlock()">Unlock Premium</button>
  <p style="font-size:12px;color:#666;margin-top:8px">Admin code: ADMIN2025 — or after user pays, tell them code: MOOD5000</p>
  </div>`}
  <h3>Your Entries</h3>
  ${entries.slice().reverse().map((en,i)=>`<div class=card style="display:flex;justify-content:space-between"><div><b>${MOODS.find(m=>m.v===en.mood)?.e} ${en.date} ${en.time}</b><div>${en.note}</div><small>${(en.acts||[]).join(', ')}</small></div><button class=btn2 onclick="del(${entries.length-1-i})">X</button></div>`).join('')||'<p>No entries yet</p>'}
  `;
}
function toggle(a){ selActs=selActs.includes(a)?selActs.filter(x=>x!==a):[...selActs,a]; render(); }
function add(){
  const d=document.getElementById('d').value, t=document.getElementById('t').value, n=document.getElementById('note').value;
  entries.push({mood:selMood,date:d,time:t,note:n,acts:selActs}); save(); selActs=[]; render();
}
function del(i){ entries.splice(i,1); save(); render(); }
function unlock(){ const c=document.getElementById('code').value; if(c==='MOOD5000'||c==='ADMIN2025'){ localStorage.setItem('premium','yes'); isPremium=true; render(); alert('Premium Unlocked!'); } else alert('Wrong code'); }
render();
</script></body></html>
